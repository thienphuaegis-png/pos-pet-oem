<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>POS Bán Hàng Mobile</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22><text y=%2222%22 font-size=%2222%22>🛒</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap');
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            overscroll-behavior-y: none;
        }
        .font-mono-num { font-family: 'JetBrains Mono', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .touch-btn {
            min-height: 44px;
            min-width: 44px;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col select-none">

    <!-- ==================== HEADER MOBILE ==================== -->
    <header class="bg-sky-600 text-white px-3 py-2.5 flex items-center justify-between shrink-0 shadow-sm z-20">
        <div class="flex items-center gap-2">
            <a href="/" class="p-1.5 rounded-xl bg-white/10 active:bg-white/20 text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            </a>
            <div>
                <h1 class="text-sm font-extrabold leading-tight">POS Thu Ngân</h1>
                <p class="text-[11px] text-sky-100" id="mob-pos-staff-name">Nhân viên bán hàng</p>
            </div>
        </div>
        <div class="flex items-center gap-1.5">
            <button onclick="reloadPOSDataMobile()" class="p-2 rounded-xl bg-white/10 active:bg-white/20" title="Tải lại">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            </button>
            <a href="/pos?force=desktop" class="px-2.5 py-1.5 rounded-xl bg-white/10 active:bg-white/20 text-[11px] font-bold">
                💻 Máy tính
            </a>
        </div>
    </header>

    <!-- ==================== SEARCH & QUICK BAR ==================== -->
    <div class="p-2.5 bg-white border-b border-slate-200 flex gap-2 shrink-0 z-10 shadow-xs">
        <div class="relative flex-1">
            <span class="absolute left-3 top-2.5 text-slate-400 text-sm">🔍</span>
            <input type="text" id="mob-search-input" oninput="filterMobileProducts(this.value)" 
                   placeholder="Tìm món, mã hàng, quét mã..." 
                   class="w-full pl-9 pr-3 py-2 text-sm bg-slate-100 rounded-xl border-0 focus:ring-2 focus:ring-sky-500 outline-none">
        </div>
        <button onclick="focusSearch()" class="touch-btn bg-sky-50 text-sky-700 px-3 py-2 rounded-xl font-bold text-xs flex items-center gap-1 active:bg-sky-100 shrink-0">
            <span>📷</span>
            <span>Quét</span>
        </button>
    </div>

    <!-- ==================== CATEGORIES HORIZONTAL PILLS ==================== -->
    <div class="flex gap-1.5 px-2.5 py-2 bg-slate-50 border-b border-slate-200 overflow-x-auto no-scrollbar shrink-0 text-xs">
        <button type="button" onclick="selectMobileCat('')" class="mob-cat-pill active px-3.5 py-1.5 rounded-full bg-sky-600 text-white font-bold shrink-0 shadow-xs">Tất cả</button>
        <button type="button" onclick="selectMobileCat('spa')" class="mob-cat-pill px-3.5 py-1.5 rounded-full bg-white text-slate-700 font-semibold border border-slate-200 shrink-0">🛁 Spa & Tắm</button>
        <button type="button" onclick="selectMobileCat('thức ăn')" class="mob-cat-pill px-3.5 py-1.5 rounded-full bg-white text-slate-700 font-semibold border border-slate-200 shrink-0">🍖 Thức ăn</button>
        <button type="button" onclick="selectMobileCat('cát')" class="mob-cat-pill px-3.5 py-1.5 rounded-full bg-white text-slate-700 font-semibold border border-slate-200 shrink-0">📦 Cát vệ sinh</button>
        <button type="button" onclick="selectMobileCat('dịch vụ')" class="mob-cat-pill px-3.5 py-1.5 rounded-full bg-white text-slate-700 font-semibold border border-slate-200 shrink-0">✂️ Dịch vụ</button>
        <button type="button" onclick="selectMobileCat('phụ kiện')" class="mob-cat-pill px-3.5 py-1.5 rounded-full bg-white text-slate-700 font-semibold border border-slate-200 shrink-0">🪢 Phụ kiện</button>
    </div>

    <!-- ==================== PRODUCT CATALOG LIST / GRID ==================== -->
    <main class="flex-1 overflow-y-auto p-2.5 pb-24" id="mob-product-catalog-container">
        <!-- Rendered by pos_mobile.js -->
        <div class="grid grid-cols-2 gap-2.5" id="mob-product-grid">
            <div class="col-span-2 text-center text-slate-400 py-12 text-sm">Đang tải danh sách hàng hóa...</div>
        </div>
    </main>

    <!-- ==================== FLOATING CART DOCK (ALWAYS VISIBLE) ==================== -->
    <div id="mobile-cart-dock" class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur border-t border-slate-200 px-3 py-2.5 flex items-center justify-between shadow-2xl z-30">
        <div onclick="openCartSheet()" class="flex items-center gap-2.5 flex-1 cursor-pointer">
            <div class="w-11 h-11 rounded-2xl bg-sky-600 text-white flex items-center justify-center font-bold relative shadow-md">
                <span>🛒</span>
                <span id="mob-cart-badge" class="absolute -top-1.5 -right-1.5 bg-rose-500 text-white text-[10px] font-extrabold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white">0</span>
            </div>
            <div>
                <div class="font-mono-num text-base font-extrabold text-slate-900 leading-tight" id="mob-cart-total-display">0 đ</div>
                <div class="text-[11px] text-sky-600 font-semibold flex items-center gap-1">
                    <span>Chạm xem chi tiết đơn</span>
                    <span>▲</span>
                </div>
            </div>
        </div>
        <button onclick="openCartSheet(true)" class="touch-btn bg-emerald-600 active:bg-emerald-700 text-white font-extrabold text-xs px-5 py-2.5 rounded-xl shadow-lg shadow-emerald-100 flex items-center gap-1.5 shrink-0">
            <span>Thanh Toán</span>
            <span class="text-sm font-black">→</span>
        </button>
    </div>

    <!-- ==================== CART & CHECKOUT BOTTOM SHEET ==================== -->
    <div id="mob-cart-sheet-backdrop" onclick="closeCartSheet()" class="fixed inset-0 bg-black/60 z-40 hidden transition-opacity"></div>
    <div id="mob-cart-sheet" class="fixed inset-x-0 bottom-0 max-h-[92vh] bg-white rounded-t-3xl z-50 flex flex-col shadow-2xl transition-transform duration-300 translate-y-full">
        
        <!-- Sheet Handle & Header -->
        <div class="p-3 border-b border-slate-100 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-2">
                <span class="text-base">🛒</span>
                <h3 class="text-sm font-bold text-slate-800">Giỏ Hàng (<span id="mob-sheet-items-count">0</span> món)</h3>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="clearMobileCart()" class="text-xs text-rose-500 font-semibold hover:underline">Xóa hết</button>
                <button onclick="closeCartSheet()" class="p-1 text-slate-400 hover:text-slate-600 font-bold text-lg leading-none">&times;</button>
            </div>
        </div>

        <!-- Scrollable Cart Items List -->
        <div class="flex-1 overflow-y-auto p-3 divide-y divide-slate-100" id="mob-cart-items-list">
            <!-- Items injected here -->
        </div>

        <!-- Customer & Discounts Section -->
        <div class="p-3 bg-slate-50 border-t border-slate-200 space-y-2 text-xs shrink-0">
            <!-- Customer Selector -->
            <div class="flex items-center justify-between bg-white p-2 rounded-xl border border-slate-200">
                <div class="flex items-center gap-2 min-w-0">
                    <span class="text-slate-400">👤</span>
                    <span class="font-bold text-slate-800 truncate" id="mob-sheet-customer-name">Khách lẻ</span>
                </div>
                <button onclick="openSelectCustomerModal()" class="text-sky-600 font-bold text-[11px] shrink-0">Đổi khách</button>
            </div>

            <!-- Total Breakdown -->
            <div class="flex justify-between items-center text-slate-600">
                <span>Tiền hàng:</span>
                <span class="font-mono-num font-bold text-slate-800" id="mob-sheet-subtotal">0 đ</span>
            </div>
            <div class="flex justify-between items-center text-slate-600">
                <span>Giảm giá:</span>
                <input type="number" id="mob-sheet-discount" oninput="calculateMobileTotal()" placeholder="0" class="w-24 text-right border border-slate-200 rounded-lg px-2 py-1 font-bold text-rose-600 text-xs">
            </div>
            <div class="flex justify-between items-baseline pt-2 border-t border-slate-200">
                <span class="font-bold text-sm text-slate-900">Khách cần trả:</span>
                <span class="font-mono-num text-xl font-black text-sky-600" id="mob-sheet-final-amount">0 đ</span>
            </div>

            <!-- Payment Method Pills -->
            <div class="pt-1 grid grid-cols-2 gap-1.5">
                <button type="button" onclick="setMobilePayMethod('cash')" id="mob-pay-cash" class="touch-btn py-2 text-center text-xs font-bold rounded-xl border-2 border-sky-600 bg-sky-50 text-sky-700 shadow-xs">
                    💵 Tiền Mặt
                </button>
                <button type="button" onclick="setMobilePayMethod('transfer')" id="mob-pay-transfer" class="touch-btn py-2 text-center text-xs font-bold rounded-xl border-2 border-slate-200 bg-white text-slate-600">
                    📲 VietQR / Chuyển Khoản
                </button>
            </div>

            <!-- Confirm Order Button -->
            <button onclick="submitMobileOrder()" id="btn-submit-mobile-order" class="touch-btn w-full bg-emerald-600 active:bg-emerald-700 text-white font-black py-3 rounded-2xl shadow-lg shadow-emerald-200 text-sm tracking-wide mt-2">
                XÁC NHẬN BÁN & IN BILL
            </button>
        </div>

    </div>

    <!-- ==================== CUSTOMER SELECTION MODAL ==================== -->
    <div id="mob-cust-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex flex-col justify-end">
        <div class="bg-white rounded-t-3xl max-h-[85vh] flex flex-col p-4">
            <div class="flex items-center justify-between pb-3 border-b">
                <h3 class="font-bold text-sm text-slate-800">Chọn Khách Hàng</h3>
                <button onclick="closeSelectCustomerModal()" class="text-slate-400 font-bold text-base">&times;</button>
            </div>
            <input type="text" id="mob-cust-search" oninput="filterCustomerList(this.value)" placeholder="Tìm theo tên hoặc số điện thoại..." class="mt-3 w-full p-2.5 bg-slate-100 rounded-xl text-xs outline-none">
            <div class="flex-1 overflow-y-auto divide-y my-2 text-xs" id="mob-cust-list">
                <!-- Customers list -->
            </div>
            <button onclick="selectCustomerQuick(null)" class="touch-btn w-full py-2.5 bg-slate-100 font-bold rounded-xl text-slate-700 text-xs">Chọn Khách Lẻ</button>
        </div>
    </div>

    <script src="/static/js/pos_mobile.js?v=20261004_01"></script>
</body>
</html>
