name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          RAW_REF="${{ secrets.SUPABASE_PROJECT_REF }}"
          PROJECT_REF=$(echo "$RAW_REF" | sed -E 's|^https?://||' | sed -E 's|.*project/||' | sed -E 's|\.supabase\.co.*||' | tr -d '[:space:]/')
          TARGET_URL="https://${PROJECT_REF}.supabase.co/rest/v1/"
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "$TARGET_URL")
            
          echo "Supabase response code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 401 ]; then
            echo "Ping successful (project is kept alive)"
          else
            echo "Unexpected response: $HTTP_STATUS"
            exit 1
          fi
